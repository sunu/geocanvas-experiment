# Deploy every branch to Cloudflare. main goes to the production Worker; each other branch
# gets its own Worker (see .github/scripts/worker-name.sh). Secrets are listed in AGENTS.md.
name: Deploy

on:
  push:
    branches: ['**']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: write, to post the preview link on the branch's pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web app
        run: npm run build -w apps/web
      - name: Deploy Worker
        id: deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          MONTANDON_TOKEN: ${{ secrets.MONTANDON_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
        run: |
          name=$(../../.github/scripts/worker-name.sh "$BRANCH")
          # Secrets belong to one Worker, and each branch is its own Worker, so upload the API keys with
          # every deploy. A key the repository does not have is left out: without MONTANDON_TOKEN or
          # OPENCAGE_API_KEY its route answers with a 503; without OPENROUTER_API_KEY the board agent
          # answers that it is not configured.
          secrets=()
          (umask 077 && jq -n '{MONTANDON_TOKEN: env.MONTANDON_TOKEN, OPENROUTER_API_KEY: env.OPENROUTER_API_KEY, OPENCAGE_API_KEY: env.OPENCAGE_API_KEY}
            | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/secrets.json")
          if [ "$(jq length "$RUNNER_TEMP/secrets.json")" -gt 0 ]; then
            secrets=(--secrets-file "$RUNNER_TEMP/secrets.json")
          fi
          npx wrangler deploy --name "$name" "${secrets[@]}" | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)
          echo "Deployed \`$BRANCH\` to $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Link the preview on the branch's pull request
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/pr-preview-comment.sh "$BRANCH" "$URL" "${GITHUB_SHA::7}"
