# Deploy every branch to Cloudflare. main goes to the production Worker; each other branch
# gets its own Worker (see .github/scripts/worker-name.sh). Secrets are listed in AGENTS.md.
name: Deploy

on:
  push:
    branches: ['**']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build web app
        run: npm run build -w apps/web
      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          name=$(../../.github/scripts/worker-name.sh "$BRANCH")
          npx wrangler deploy --name "$name" | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)
          echo "Deployed \`$BRANCH\` to $url" >> "$GITHUB_STEP_SUMMARY"
