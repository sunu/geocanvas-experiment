# When a branch is deleted, delete the Worker that deploy.yml made for it, with its rooms.
name: Delete branch Worker

on: delete

jobs:
  delete:
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delete Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event.ref }}
        run: |
          name=$(../../.github/scripts/worker-name.sh "$BRANCH")
          # Branches that never deployed (e.g. made before this workflow existed) have no Worker.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name/settings")
          if [ "$status" = 404 ]; then
            echo "No Worker named $name; nothing to delete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler delete --name "$name"
          echo "Deleted Worker $name" >> "$GITHUB_STEP_SUMMARY"
